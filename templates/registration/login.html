{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — Sistema Médico</title>
  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  <style>
    body {
      background-color: #f4f6f9;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .card-login {
      border: 1px solid #e0e4e8;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
      background: white;
    }
    .card-body {
      padding: 2.5rem;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-container i {
      font-size: 2.5rem;
      color: #0d6efd;
    }
    .login-title {
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      color: #333;
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: #6c757d;
      text-align: center;
      margin-bottom: 2rem;
    }
    .form-control {
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      border-radius: 6px;
    }
    .btn-login {
      padding: 0.75rem;
      font-weight: 500;
      border-radius: 6px;
      width: 100%;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="card card-login">
      <div class="card-body">
        
        <div class="logo-container">
          <i class="bi bi-heart-pulse"></i>
        </div>

        <h1 class="login-title">CPT3 Concepción Mariño</h1>
        <p class="login-subtitle">Acceso al Sistema Médico</p>

        {% if form.non_field_errors %}
        <div class="alert alert-danger py-2" role="alert" style="font-size: 0.85rem;">
          <i class="bi bi-exclamation-triangle me-1"></i> {{ form.non_field_errors.0 }}
        </div>
        {% endif %}

        <form method="post" autocomplete="off">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="{{ form.username.id_for_label }}" class="form-label text-secondary small fw-bold">Usuario</label>
            <input
                type="text"
                class="form-control"
                name="{{ form.username.html_name }}"
                id="{{ form.username.id_for_label }}"
                placeholder="Nombre de usuario"
                autocomplete="username"
                {% if form.username.value %}value="{{ form.username.value }}"{% endif %}
                required>
          </div>

          <div class="mb-3">
            <label for="{{ form.password.id_for_label }}" class="form-label text-secondary small fw-bold">Contraseña</label>
            <input
                type="password"
                class="form-control"
                name="{{ form.password.html_name }}"
                id="{{ form.password.id_for_label }}"
                placeholder="Contraseña"
                autocomplete="current-password"
                required>
          </div>

          <button type="submit" class="btn btn-primary btn-login">
            Iniciar Sesión
          </button>
        </form>

      </div>
    </div>
    
    <div class="text-center mt-4 text-muted" style="font-size: 0.75rem;">
      &copy; 2026 Universidad Bolivariana de Venezuela
    </div>
  </div>

  <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
