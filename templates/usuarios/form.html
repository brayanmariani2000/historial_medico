{% extends 'base.html' %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center gap-2 mb-4">
  <a href="{% url 'usuarios:lista' %}" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i></a>
  <h4 class="mb-0">{{ page_title }}</h4>
</div>
<div class="form-card" style="max-width:600px;">
  <form method="post" novalidate>{% csrf_token %}
    <div class="row g-3">
      {% for field in form %}
      <div class="col-md-6">
        <label>{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
        {{ field }}
        {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
      </div>
      {% endfor %}
    </div>
    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i>{{ action }}</button>
      <a href="{% url 'usuarios:lista' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
